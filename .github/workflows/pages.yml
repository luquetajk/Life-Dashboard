name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar o site
        run: |
          idx=$(find . -path ./.git -prune -o -type f -path '*/docs/index.html' -print | head -n 1)
          test -n "$idx" || { echo "docs/index.html nao encontrado"; exit 1; }
          mkdir -p _site
          cp -r "$(dirname "$idx")/." _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
